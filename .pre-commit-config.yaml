repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0  # Use the latest stable version
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [ --allow-multiple-documents ]
      - id: detect-private-key
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: maven-spotless-apply
        name: Maven Spotless Apply - Formatting
        entry: mvn
        args: [ "spotless:apply" ]
        language: system
        types: [ java ]
        pass_filenames: false # prevent filenames used as arguments during the execution
      - id: maven-checkstyle
        name: Maven Checkstyle - Linting
        entry: mvn
        args: [ "checkstyle:check" ]
        language: system
        types: [ java ]
        pass_filenames: false # prevent filenames used as arguments during the execution
      - id: maven-pmd
        name: Programming Mistake Detector
        entry: mvn
        args: [ "pmd:check" ]
        language: system
        types: [ java ]
        pass_filenames: false # prevent filenames used as arguments during the execution
      - id: maven-build
        name: Build Project
        entry: mvn
        args: [ "clean", "compile" ]
        language: system
        pass_filenames: false
